<text x="32" y="32" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#222222" font-weight="bold">03. Factory Method</text>
<text x="32" y="53" font-family="DejaVu Sans, sans-serif" font-size="10.2" fill="#222222">incorporar() reutiliza el procedimiento común; crear() es el método fábrica que cada creador concreto redefine.</text>
<polyline points="32.00,66.00 1158.55,66.00" fill="none" stroke="#333333" stroke-width="0.7"/>
<text x="455" y="565" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#222222" font-weight="bold">Procedimiento común de incorporar():</text>
<text x="455" y="588" font-family="DejaVu Sans, sans-serif" font-size="9.7" fill="#222222">1. guardia = self.crear(datos, colisiones)</text>
<text x="455" y="610" font-family="DejaVu Sans, sans-serif" font-size="9.7" fill="#222222">2. nivel.agregar_guardia(guardia)</text>
<text x="455" y="636" font-family="DejaVu Sans, sans-serif" font-size="9.1" fill="#222222">El creador concreto decide la clase del guardia.</text>
